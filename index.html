    <script>
      // Apply the saved color scheme before first paint (dark by default).
      ;(function () {
        try {
          var scheme = localStorage.getItem('vueuse-color-scheme') || 'dark'
          var dark = scheme === 'dark' || (scheme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
